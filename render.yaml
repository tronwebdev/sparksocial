# Render Blueprint — SparkSocial
#
# Companion to `infra/render/MIGRATION.md`, which explains the reasoning. This
# file is the executable half; read §0 of that document first, because one of
# its two blockers is a code change and this file cannot help with it.
#
# ── Before this works ─────────────────────────────────────────────────────
#
#   1. An R2 bucket (or any S3-compatible store) exists, and the env group
#      carries R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY.
#      `apps/api/src/tools.ts::blobStore()` picks R2 ahead of Azure, and falls
#      back to local disk when neither is set — which on Render means a disk that
#      disappears with the instance.
#   2. `CREATE EXTENSION vector` has been run on the database.
#   3. The env group `sparksocial-secrets` exists, populated from
#      `infra/azure/secrets.manifest` — 3 required, 46 optional.
#
# ── The rule that matters most about the env group ────────────────────────
#
# Leave unconfigured keys OUT. Never add them as blank placeholders. `defineTool`
# registration is gated on `envSet(...)`: an absent key leaves its tool cleanly
# unregistered and the button is simply not there, where an empty string
# registers the tool and fails at call time — which reads to a customer as "the
# product is broken" rather than "this is not configured".

services:
  # ── API ─────────────────────────────────────────────────────────────────
  #
  # Public because OAuth callbacks and the WhatsApp webhook need ingress.
  #
  # `plan: standard` is a floor, not a preference. This image installs Debian,
  # ffmpeg, Chromium and Liberation fonts — Playwright crawls sites during
  # onboarding and Remotion renders video — and a render on a 512MB instance
  # will OOM. Free instances also spin down when idle, which silently breaks the
  # webhook and every OAuth callback.
  - type: web
    name: sparksocial-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    # Off on purpose: migrations run in CI and must land before the new code
    # does. See `infra/render/MIGRATION.md` §6 — with auto-deploy on, the deploy
    # races the migration and new code meets an old schema.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sparksocial-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sparksocial-cache
          property: connectionString
      # Every secret, from the group. See the note at the top of this file.
      - fromGroup: sparksocial-secrets
      # `REVISION` — which commit `/health` reports — is deliberately absent.
      #
      # Azure's workflow stamped it from the build SHA. Render sets
      # `RENDER_GIT_COMMIT` itself, and there is no need to copy it: this is the
      # api service, so that variable is already in its own environment.
      # Copying it was in fact impossible — `fromService` with
      # `envVarKey: RENDER_GIT_COMMIT` fails at sync with `environment variable
      # not found`, because Render's built-in variables are present in the
      # running process but are not readable as a service's *configuration*,
      # which is what `fromService` looks up. `apps/api/src/env.ts`'s
      # `revision()` reads `REVISION` first and falls back to
      # `RENDER_GIT_COMMIT`, so it works on both platforms with no entry here.
      #
      # ── Cross-service URLs: written out, not resolved ────────────────────
      #
      # This file has now argued both ways, so here is the whole of it.
      #
      # It first hardcoded these, reasoning that `fromService: { property: host }`
      # returns a bare hostname with no scheme. Then it switched to
      # `fromService: { envVarKey: RENDER_EXTERNAL_URL }`, which does carry the
      # scheme and which syncs without complaint. That was the wrong lesson from
      # a real correction: `envVarKey` against a platform default is already
      # known to fail outright when a service reads its *own* — Render stores
      # those nowhere a Blueprint lookup can see, it injects them into the
      # running process. Cross-service the sync accepts it, which only moves the
      # same uncertainty somewhere quieter: accepted is not resolved, and the
      # failure of an empty value is not a sync error but a 500 on every tool
      # call, hours later, in front of a customer.
      #
      # So: written out. The hostnames are a function of the service names in
      # this very file, they are stable until somebody attaches a custom domain,
      # and the two redirect URIs below have always been written out anyway —
      # they are a URL *plus a path*, which the Blueprint spec cannot
      # concatenate. One mechanism for all five beats a clever one for three.
      #
      # `CLERK_AUTHORIZED_PARTIES` is the one that makes this matter most:
      # `apps/api/src/index.ts` defaults it to `http://localhost:3000`, which
      # does not throw — it silently rejects every sign-in from the deployed
      # origin.
      #
      # **These now use the custom domains** (`app.` / `api.sparkai.social`). If a
      # domain ever changes, every URL here changes with it; grep for `sparkai.social`.
      # Pinned for the same reason as the two below it and as SPARK_API_URL on
      # the web service — see that note. `WEB_APP_URL` is what links in capture
      # messages and notifications point at, so an empty one is a dead link in
      # somebody's inbox rather than a loud failure.
      - key: WEB_APP_URL
        value: https://app.sparkai.social
      # Same reasoning — see the note on SPARK_API_URL.
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://app.sparkai.social,https://sparksocial-web.onrender.com
      # `LOCAL_STORAGE_PUBLIC_URL` is absent for the same reason: it would be
      # this service's own `RENDER_EXTERNAL_URL`, which `apps/api/src/tools.ts`
      # now reads directly as the fallback base URL. It only matters when no
      # cloud store is configured — R2 and Azure both return absolute URLs.
      - key: SOCIAL_REDIRECT_URI
        value: https://api.sparkai.social/oauth/social/callback
      - key: CANVA_REDIRECT_URI
        value: https://api.sparkai.social/oauth/canva/callback

  # ── Web ─────────────────────────────────────────────────────────────────
  #
  # A Next.js `output: 'standalone'` build, cheap next to the API.
  #
  # The `NEXT_PUBLIC_*` values below are baked into the client bundle at BUILD
  # time: Render injects a service's env vars as Docker build args and
  # `apps/web/Dockerfile` already declares each one as an `ARG`. That also means
  # changing one needs a rebuild, not a restart — a runtime env var will not move
  # a value that is already in the JavaScript.
  - type: web
    name: sparksocial-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      # Hardcoded, deliberately, after a 500 on every tool call.
      #
      # This was `fromService: { envVarKey: RENDER_EXTERNAL_URL }`. That form is
      # already known not to work for a service reading its *own* platform
      # defaults — it fails at sync with `environment variable not found`,
      # because those are injected into the running process rather than stored
      # as configuration `fromService` can look up. Cross-service it does not
      # fail the sync, which is worse: it is accepted and can still yield an
      # empty value, and an empty base URL makes the web tier's fetch target
      # `/v1/tools/...` with no origin, which rejects before any request leaves
      # the process. The proxy now reports that as a 502 naming the URL it
      # tried, but the value should not have been in doubt in the first place.
      #
      # The hostname is derived from the service name and is already hardcoded
      # twice below for the OAuth redirects. Three times is a pattern worth
      # naming rather than a smell: Render has no Blueprint expression for "the
      # other service's URL" that is both reliable and readable.
      - key: SPARK_API_URL
        value: https://api.sparkai.social
      # `sync: false` means "set this in the dashboard" — the value never enters
      # the repo. Required: without it the web app cannot start a session.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_SOCIAL_PROVIDERS
        value: google
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://eu.i.posthog.com

  # ── Marketing site ──────────────────────────────────────────────────────
  #
  # `marketing/` is plain HTML/CSS/JS with no build step, so it is a static
  # site: free, CDN-served, and it never sleeps the way a free web service does.
  #
  # The build copies an allow-list rather than publishing the folder as-is.
  # `marketing/` also holds `mautic-setup/` (server scripts and a runbook),
  # `.claude/` and the README, and publishing the directory would serve all of
  # them to anyone who guessed the path. Add new public files to the list.
  #
  # Custom domains (`sparkai.social`, plus the `www` Render adds for it) are
  # attached in the dashboard — see `infra/render/DOMAINS_AND_VENDORS.md`.
  - type: web
    name: sparksocial-marketing
    runtime: static
    rootDir: marketing
    buildCommand: rm -rf dist && mkdir dist && cp -r index.html privacy.html terms.html css js assets dist/
    staticPublishPath: dist
    # Only rebuild when the site itself changes, not on every API commit.
    buildFilter:
      paths:
        - marketing/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ── Key Value (Redis) ───────────────────────────────────────────────────
  #
  # Optional. `REDIS_URL` is `optional` in the manifest and the app runs without
  # it — but rate limits are then per-replica, so the effective budget
  # multiplies by replica count. Fine at one instance; not fine once the API
  # scales out. Delete this service and the API's REDIS_URL together if you do
  # not want it: an empty REDIS_URL is worse than an absent one.
  - type: keyvalue
    name: sparksocial-cache
    # `free` alongside the database, and the trade is sharper here: a free Key
    # Value instance is **in-memory only**, so every restart loses the lot.
    #
    # That is survivable for exactly what this holds — publish rate-limit
    # counters — because losing them resets a budget rather than corrupting
    # anything. It would not be survivable for a queue or a session store, so do
    # not let anything of that shape move in here while it is free.
    #
    # 25 MB, 50 connections, one free instance per workspace. `256mb` is the
    # paid step up, which is what the legacy name `starter` mapped to.
    plan: free
    # Hyphens, not underscores — Render takes the Redis spelling, and rejects
    # `allkeys_lru` at sync. This is also the default, kept explicit because an
    # eviction policy is a thing worth stating rather than inheriting.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []            # private network only — no public access


databases:
  # `postgresMajorVersion: 16` for pgvector, which needs PG 13+. Unlike Azure
  # there is no allow-list step: run `CREATE EXTENSION vector` once, before
  # restoring any dump, or every `vector` column fails to restore.
  #
  # Check the plan's connection limit against `packages/db/src/client.ts`, whose
  # ceiling is `max × replicas` (10 per replica by default). The small plans
  # allow fewer than the Flexible Server this was sized against.
  - name: sparksocial-db
    # `free` while this is a test deployment. 0.1 CPU, 256 MB, 1 GB of storage,
    # and 100 connections — which is the number that actually matters here,
    # since `packages/db/src/client.ts` opens up to `max × replicas` and `max`
    # is 10. There is plenty of headroom.
    #
    # ── Three things the free plan does that a paid one does not ───────────
    #
    #   1. **It expires 30 days after creation**, then gives a 14-day grace
    #      period to upgrade. After that Render deletes it and everything in it.
    #      Put a reminder somewhere that is not this file.
    #   2. One free database per workspace. A second Blueprint cannot have one.
    #   3. 1 GB fixed. Rendered video does not live here — that is R2 — but
    #      `tool_calls` and `agent_steps` grow quickly under real use.
    #
    # Moving to a paid plan later is a one-line change to `1c-2g`, which is what
    # the retired `standard` name mapped to. Moving *back* is not possible once
    # a database leaves a legacy instance type.
    plan: free
    postgresMajorVersion: "16"

envVarGroups:
  # Populated by hand in the dashboard, from `infra/azure/secrets.manifest`.
  # Deliberately empty here: a value committed to this file is a value in git.
  #
  # Required (3): DATABASE_URL — supplied above from the database, so not needed
  # here — CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY.
  #
  # Plus R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, which
  # post-date that manifest and are what make object storage work at all here.
  - name: sparksocial-secrets
    envVars: []
