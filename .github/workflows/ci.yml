name: CI

# Runs on every push and PR. The two jobs that matter are `guardrails` — they
# encode CLAUDE.md invariants 2 and 3 as build failures rather than as review
# comments, which is the only way those rules survive contact with a deadline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `tsc --noEmit` does not catch a missing "use client", a server/client
      # boundary violation, or a misused font loader — only a real Next build
      # does, and all three fail at runtime rather than at typecheck.
      - name: Build web
        run: npm run build:web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder

  guardrails:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # CLAUDE.md invariant 2 — genome isolation is a repository predicate.
      # Fails the build if any module reaches a scoped table directly.
      - name: Genome isolation
        run: npm run test:isolation

      # CLAUDE.md invariant 3 — the policy engine is pure and fully covered.
      # The 100% branch threshold is enforced in vitest.config.ts, so an
      # unreachable-but-untested governance branch fails here.
      - name: Policy engine coverage
        run: npx vitest run --coverage

  secrets-scan:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLAUDE.md: never commit tokens, PATs, or connection strings. Azure auth
      # is Key Vault + Managed Identity in cloud and `az login` locally, so a
      # connection string appearing in the tree is always a mistake.
      #
      # The gitleaks CLI, not `gitleaks/gitleaks-action@v2`. The action requires
      # a paid GITLEAKS_LICENSE for organization-owned repositories, and without
      # one it fails the job *after* reporting a clean scan:
      #
      #   No committed secrets
      #   🛑 missing gitleaks license.
      #
      # A security gate that goes red on billing rather than on findings is worse
      # than no gate, because the red stops meaning anything. The CLI is MIT and
      # does the same detection; what the action adds on top is PR comments and a
      # job summary, neither of which is why this job exists.
      #
      # Pinned rather than floating: a scanner that silently changes version is a
      # scanner whose passes are not comparable between commits.
      - name: Scan history for credentials
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/v${GITLEAKS_VERSION}/${tarball}" | tar -xz gitleaks
          # --redact so a finding names the file and the rule without reprinting
          # the secret itself into a build log.
          ./gitleaks detect --source . --redact --verbose --exit-code 1
